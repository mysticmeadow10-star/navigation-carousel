<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Use Of Carousel And Navigaton Bar</title>
    <style>

        .navbar {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color:white;
            text-decoration: none;
            margin: 0 15px;
        }

        .carousel {
            width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        .track img {
            width:600px;
            height: 300px;
        }

        .button {
            margin: 10px 5px;
            padding: 5px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <a href="#">Logo</a>
        <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        </div>
    </nav>

    <div class="carousel">
        <button class="btn previous" onclick="show('img0')">1</button>
        <button class="button" style="left:40px;" onclick="show('img1')">2</button>
        <button class="button next" onclick="show('img2')">3</button>

        <div class="track">
            <img src="captain_america_chibi-removebg-preview.png">
            <img src="gif space copy 2.webp">
            <img src="italian pizza.jpg">
        </div>
    </div>

    <script>
        function show(id) {
            document.getElementById(id).scrollIntoView();
        }
    </script>
</body>
</html>
